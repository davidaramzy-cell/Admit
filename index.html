<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admission Router</title>
<meta name="description" content="Route each admission to the right service and the right phone call.">
<meta name="application-name" content="Admission Router">
<meta name="apple-mobile-web-app-title" content="Admission Router">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1c24">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<meta property="og:title" content="Admission Router">

<style>
  :root{
    --ink:#0e1c24; --ink2:#15303b;
    --paper:#eef2f3; --card:#ffffff; --line:#dde5e8; --line2:#eef2f4;
    --muted:#5d6e78; --text:#16242c;
    --us:#0f766e;      --us-bg:#e6f4f1;
    --call:#1f54c4;    --call-bg:#e8eefb;
    --med:#b45309;     --med-bg:#fbeede;
    --peds:#6d28d9;    --peds-bg:#efe9fb;
    --warn:#b42318;    --warn-bg:#fbe9e7;
    --focus:#0f766e;
    --r:14px;
    --fs:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--text);font-family:var(--fs);-webkit-text-size-adjust:100%}
  body{padding:18px 14px 60px;display:flex;justify-content:center}
  .app{width:100%;max-width:560px}

  /* Header */
  .head{background:var(--ink);color:#eaf2f3;border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
  .head:before{content:"";position:absolute;inset:0;background:
     radial-gradient(120% 90% at 100% 0%, rgba(15,118,110,.45), transparent 60%);pointer-events:none}
  .kicker{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#7fb7b2;font-weight:700;margin:0 0 4px}
  .h1{font-size:19px;font-weight:750;letter-spacing:-.01em;margin:0;line-height:1.15}
  .sub{font-size:12.5px;color:#a9c3c5;margin:6px 0 0}
  .reset{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.08);color:#dcebec;border:1px solid rgba(255,255,255,.16);
     font-size:11px;font-weight:650;letter-spacing:.02em;padding:7px 11px;border-radius:9px;cursor:pointer}
  .reset:hover{background:rgba(255,255,255,.16)}

  /* Path rail */
  .path{margin:14px 2px 2px;display:flex;flex-direction:column;gap:0}
  .pnode{display:flex;gap:11px;align-items:flex-start;min-height:30px}
  .pdot{flex:0 0 auto;width:18px;display:flex;flex-direction:column;align-items:center}
  .pdot i{width:11px;height:11px;border-radius:50%;background:var(--line);border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line);margin-top:3px}
  .pdot .bar{width:2px;flex:1;background:var(--line);min-height:14px;margin:2px 0}
  .pnode.done .pdot i{background:var(--us);box-shadow:0 0 0 1.5px var(--us)}
  .pnode.done .pdot .bar{background:var(--us)}
  .pnode.active .pdot i{background:var(--ink);box-shadow:0 0 0 1.5px var(--ink);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 1.5px var(--ink)}50%{box-shadow:0 0 0 4px rgba(14,28,36,.18)}}
  .ptext{padding-bottom:11px;flex:1;min-width:0}
  .plabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .pans{font-size:14px;font-weight:600;color:var(--text);margin-top:1px}
  .pnode.pending .plabel,.pnode.pending .pans{opacity:.45}

  /* Step card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px;
     box-shadow:0 1px 0 rgba(16,40,50,.02),0 10px 26px -22px rgba(16,40,50,.5);animation:rise .28s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .q{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin:0 0 3px}
  .qhint{font-size:12.5px;color:var(--muted);margin:0 0 14px;line-height:1.45}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fbfdfd;border:1.5px solid var(--line);
     border-radius:11px;padding:13px 14px;cursor:pointer;font:inherit;color:var(--text);transition:.13s}
  .opt:hover{border-color:var(--ink2);background:#f3f8f8}
  .opt:focus-visible{outline:3px solid color-mix(in srgb,var(--focus) 35%,transparent);outline-offset:1px}
  .opt b{font-size:14.5px;font-weight:680}
  .opt span{font-size:12px;color:var(--muted);display:block;margin-top:2px;font-weight:500}
  .opt .ic{flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;
     background:var(--us-bg);color:var(--us);font-weight:800}
  .opt.alt .ic{background:var(--call-bg);color:var(--call)}
  .opt.flat .ic{background:var(--line2);color:var(--muted)}
  .grow{flex:1;min-width:0}

  /* Search */
  .srch{position:relative}
  .srch input{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font:inherit;font-size:15px;background:#fbfdfd}
  .srch input:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
  .results{margin-top:8px;border:1px solid var(--line);border-radius:11px;overflow:hidden;max-height:300px;overflow-y:auto;display:none}
  .results.show{display:block}
  .ritem{padding:11px 13px;border-bottom:1px solid var(--line2);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .ritem:last-child{border-bottom:0}
  .ritem:hover,.ritem.kbd{background:#f1f7f7}
  .rname{font-size:14px;font-weight:640}
  .rmeta{font-size:11.5px;color:var(--muted);margin-top:1px}
  .rtag{flex:0 0 auto;font-size:10px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap}
  .t-med{background:var(--med-bg);color:var(--med)} .t-hosp{background:var(--med-bg);color:var(--med)} .t-call{background:var(--call-bg);color:var(--call)}
  .t-peds{background:var(--peds-bg);color:var(--peds)} .t-us{background:var(--us-bg);color:var(--us)}
  .nohit{padding:14px;font-size:13px;color:var(--muted);text-align:center}
  .nohit b{color:var(--text)}

  /* Result card */
  .res{border-radius:var(--r);padding:0;overflow:hidden;border:1px solid var(--line);margin-top:14px;animation:rise .3s ease both}
  .res .banner{padding:15px 18px;color:#fff;display:flex;align-items:center;gap:13px}
  .res .banner .bic{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:19px;flex:0 0 auto}
  .res .banner .blab{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;opacity:.9}
  .res .banner .bbig{font-size:18px;font-weight:760;letter-spacing:-.01em;line-height:1.15;margin-top:2px}
  .res.us .banner{background:var(--us)} .res.call .banner{background:var(--call)}
  .res.med .banner{background:var(--med)} .res.peds .banner{background:var(--peds)}
  .res .body{background:var(--card);padding:16px 18px}
  .action{font-size:14.5px;line-height:1.5;font-weight:560;margin:0 0 4px}
  .action b{font-weight:740}
  .callbtn{display:flex;align-items:center;gap:11px;text-decoration:none;margin-top:12px;border:1.5px solid var(--line);
     border-radius:11px;padding:12px 14px;background:#fbfdfd;color:var(--text)}
  .callbtn:hover{border-color:var(--ink2);background:#f3f8f8}
  .callbtn .pic{width:34px;height:34px;border-radius:8px;background:var(--call-bg);color:var(--call);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  .callbtn .who{font-size:14px;font-weight:680} .callbtn .num{font-size:13px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums}
  .ext{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--med-bg);color:var(--med);border-radius:10px;padding:11px 13px;font-size:13.5px;font-weight:650}
  .ext .pic{width:30px;height:30px;border-radius:7px;background:rgba(180,83,9,.16);display:grid;place-items:center;font-size:15px}

  .detail{margin-top:13px;border-top:1px solid var(--line2);padding-top:12px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
  .detail dt{color:var(--muted);font-weight:600} .detail dd{margin:0;font-weight:550}
  .stale{color:var(--warn);font-weight:650}

  .confirm{margin-top:14px;background:#f7fafa;border:1px solid var(--line);border-radius:12px;padding:14px}
  .confirm p{margin:0 0 10px;font-size:13.5px;font-weight:620}
  .crow{display:flex;gap:9px;flex-wrap:wrap}
  .cbtn{flex:1 1 140px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px;font:inherit;font-size:13px;font-weight:670;cursor:pointer}
  .cbtn.yes{border-color:var(--us);color:var(--us)} .cbtn.yes:hover{background:var(--us-bg)}
  .cbtn.no{border-color:var(--med);color:var(--med)} .cbtn.no:hover{background:var(--med-bg)}

  .again{margin-top:14px;width:100%;border:1.5px solid var(--ink2);background:var(--ink);color:#eaf2f3;border-radius:11px;padding:13px;font:inherit;font-size:14px;font-weight:680;cursor:pointer}
  .again:hover{background:var(--ink2)}
  .back{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;margin-top:12px;padding:4px}
  .back:hover{color:var(--text)}

  /* Protocol */
  details.proto{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  details.proto>summary{list-style:none;cursor:pointer;padding:14px 16px;font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;color:var(--text)}
  details.proto>summary::-webkit-details-marker{display:none}
  details.proto>summary .chev{color:var(--muted);transition:.2s} details.proto[open]>summary .chev{transform:rotate(90deg)}
  .ptable{padding:0 16px 14px}
  .prow{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line2);align-items:flex-start}
  .prow:first-child{border-top:0}
  .pcond{flex:1;font-size:12.5px;color:var(--text);font-weight:550}
  .pout{flex:0 0 auto;font-size:10px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap}
  .foot{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <button class="reset" id="reset">Restart</button>
    <p class="kicker">MICU → Floor Transfer</p>
    <h1 class="h1">Admission Router</h1>
    <p class="sub">Answer each step to land the patient on the right service and the right phone call.</p>
  </div>

  <div class="path" id="path"></div>
  <div id="stage"></div>

  <details class="proto">
    <summary>Protocol at a glance <span class="chev">›</span></summary>
    <div class="ptable" id="ptable"></div>
  </details>

  <p class="foot">Decision aid only — confirm the PMD's current admitting status on EmReference.com or the group chat. Directory snapshot is editable in the source.</p>
</div>

/* ---- classify a directory entry into a disposition ---- */
function classify(e){
  const a=(e.admit||"").toLowerCase();
  // No admitting arrangement on file — default per protocol to Medical Service; verify.
  if(!a){
    return {type:"us", kick:"Admit to", label:"Medical Service", icon:"☑", who:"Medical Service (Our Service)", num:"",
      action:`No admitting arrangement on file for this PMD. Default per protocol: admit to the <b>Medical Service (Our Service)</b> — verify on EmReference.com or the group chat.`};
  }
  // Hospitalist service — internal (x4929). Different from Our Service and from the PMD.
  // Refusable: if the Hospitalist declines, the patient goes straight to the Medical Service.
  if(a.startsWith("hospitalist")){
    return {type:"hosp", kick:"Admit under", label:"Hospitalist", icon:"＃", who:"Hospitalist", num:e.anum||"x4929",
      action:`EmReference lists the <b>Hospitalist</b> for this PMD. Admit under the <b>Hospitalist</b> service and call the Hospitalist at <b>${esc(e.anum||"x4929")}</b>.`,
      refusable:true};
  }
  // Medical Service == Our Service (the resident / teaching service)
  if(a.includes("medical service")){
    return {type:"us", kick:"Admit to", label:"Our Service", icon:"☑", who:"Our Service", num:"",
      action:`EmReference lists the <b>Medical Service</b> — that is <b>our service</b>. Admit to <b>Our Service</b>.`};
  }
  if(a.includes("pediatric hospitalist")){
    return {type:"peds", kick:"Route to", label:"Pediatric Hospitalist", icon:"⊕", who:"Pediatric Hospitalist", num:e.anum||"",
      action:`Pediatric patient — route to the <b>Pediatric Hospitalist</b> team.`};
  }
  if(a.includes("hva admitting team")){
    return {type:"call", kick:"Call to admit", label:"HVA Admitting Team", icon:"☎", who:"HVA Admitting Team", num:e.anum||"(201) 490-1217",
      action:`This PMD admits through <b>HVA</b>. Call the <b>HVA Admitting Team</b> to hand off.`, refusable:true};
  }
  // Pinzon, Amabelle (incl. "Makar, Gamil > Pinzon", bare "Pinzon") — her own group in Passaic, NOT HVA
  if(a.includes("pinzon")){
    return {type:"call", kick:"Call to admit", label:"Pinzon Service", icon:"☎", who:"the Pinzon service", num:"(862) 249-4901",
      action:`This PMD admits under <b>Pinzon, Amabelle</b>. She is with her own group in <b>Passaic — not HVA</b>. Call the <b>Pinzon service</b> at <b>(862) 249-4901</b>; they will route you to Dr. Pinzon, whoever is covering for her, or whoever is on call.<br><br><b>Escalation if that fails:</b><br>1 &middot; <b>Her answering service often does not pick up</b> — if no one answers, <b>text Dr. Pinzon directly on her cell</b>.<br>2 &middot; If she is <b>not working</b> and <b>no one in her service is covering</b>, call the <b>HVA Admitting Team</b> at <b>(201) 490-1217</b>.<br>3 &middot; If you <b>cannot reach anyone</b> (Pinzon, her cover, or HVA), call the <b>Hospitalist</b> at <b>x4929</b>.<br>4 &middot; If Dr. Pinzon, her cover, or HVA <b>picks up and refuses</b>, admit to the <b>Medical Service (Our Service)</b> directly.`,
      refusable:true};
  }
  if(a.includes("call first")){
    return {type:"call", kick:"Call first", label:"Call First", icon:"☎", who:(e.admit||"Attending"), num:e.anum||"",
      action:`<b>Call first</b> — this PMD/attending will direct the admission.`, refusable:true};
  }
  // named private attending (incl. covering arrangements, group names)
  return {type:"call", kick:"Call to admit", label:"Private Attending", icon:"☎", who:e.admit, num:e.anum||"",
    action:`This PMD <b>admits here</b>. Call <b>${esc(e.admit)}</b> directly and hand off the admission.`, refusable:true};
}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function telHref(num){const d=(num||"").replace(/[^0-9]/g,""); return (d.length>=7 && !/x4929/i.test(num))?("tel:"+d):null;}
function stale(upd){ if(!upd) return false; const m=upd.match(/(\d{2})\/(\d{2})\/(\d{4})/); if(!m) return false;
  const d=new Date(+m[3], +m[2]-1, +m[1]); return (Date.now()-d)/(1000*3600*24) > 730; }

/* ---- state & flow ---- */
let S = {ins:null, pmd:null, hiv:null, pick:null, accepted:null, hospAccepted:null, step:"ins"};

const path=document.getElementById('path');
const stage=document.getElementById('stage');
document.getElementById('reset').onclick=reset;

function reset(){ S={ins:null,pmd:null,hiv:null,pick:null,accepted:null,hospAccepted:null,step:"ins"}; render(); }

function render(){ drawPath(); drawStage(); }

function node(label,ans,state){
  return `<div class="pnode ${state}"><div class="pdot"><i></i><div class="bar"></div></div>
     <div class="ptext"><div class="plabel">${label}</div><div class="pans">${ans||"—"}</div></div></div>`;
}
function drawPath(){
  const steps=[];
  steps.push(["Insurance", S.ins==null?null:(S.ins?"Has insurance":"No insurance / self-pay")]);
  if(S.ins){ steps.push(["PCP / PMD on Care Team", S.pmd==null?null:(S.pmd?"PMD listed":"None listed")]); }
  if(S.ins && S.pmd){ steps.push(["PMD = our HIV clinic?", S.hiv==null?null:(S.hiv?"Yes":"No")]); }
  if(S.ins && S.pmd && S.hiv===false){ steps.push(["PMD lookup", S.pick?S.pick.name:null]); }
  if(S.pick && S.pick.disp && S.pick.disp.refusable && S.accepted!=null){
    steps.push(["Attending response", S.accepted===true?"Accepted":(S.accepted==="na"?"Did not pick up":"Refused")]);
  }
  if(S.pick && S.pick.disp && S.pick.disp.refusable && S.accepted==="na"
     && S.pick.disp.type!=="hosp"){
    steps.push(["Hospitalist response", S.hospAccepted==null?null:(S.hospAccepted?"Accepted":"Refused")]);
  }
  const active = stepIndex();
  path.innerHTML = steps.map((s,i)=>{
    const st = i<active?"done":(i===active?"active":"pending");
    return node(s[0], s[1], st);
  }).join("");
}
function stepIndex(){
  let i=0;
  if(S.ins!=null) i++; if(S.ins===false) return i-1<0?0:i-1+0; // handled by outcome
  if(S.ins){ if(S.pmd!=null) i++; }
  if(S.ins&&S.pmd){ if(S.hiv!=null) i++; }
  if(S.ins&&S.pmd&&S.hiv===false){ if(S.pick) i++; }
  if(S.pick&&S.pick.disp&&S.pick.disp.refusable){ if(S.accepted!=null) i++; }
  if(S.pick&&S.pick.disp&&S.pick.disp.refusable&&S.accepted==="na"&&S.pick.disp.type!=="hosp"){ if(S.hospAccepted!=null) i++; }
  return Math.min(i, 8);
}

function drawStage(){
  // terminal outcomes ------------------------------------------------
  if(S.ins===false)               return outcome("us","No insurance / self-pay","Admit to <b>Our Service</b> — we take self-pay patients <b>any day</b>.");
  if(S.ins && S.pmd===false)      return outcome("us","Insurance, no PMD listed","No PCP on the Care Team → admit to the <b>Medical Service (Our Service)</b>, regardless of day.");
  if(S.ins && S.pmd && S.hiv===true) return outcome("us","Our HIV clinic patient","PMD is our <b>HIV clinic</b> → admit to <b>Our Service</b>, any day.");

  if(S.pick){ return pickResult(); }

  // questions --------------------------------------------------------
  if(S.step==="ins") return ask({
    q:"Does the patient have insurance?",
    hint:"Start in the chart: check the insurance status and the Care Team section.",
    opts:[
      {cls:"", ic:"✓", t:"Has insurance", s:"Commercial, Medicare, Medicaid, etc.", go:()=>{S.ins=true;S.step="pmd";render();}},
      {cls:"flat", ic:"○", t:"No insurance / self-pay", s:"→ Our Service, any day", go:()=>{S.ins=false;render();}}
    ]});

  if(S.step==="pmd") return ask({
    q:"Is a PCP / PMD listed on the Care Team?",
    hint:"Look at the Care Team section for a named Primary Care Provider.",
    back:()=>{S.ins=null;S.step="ins";render();},
    opts:[
      {cls:"", ic:"✓", t:"Yes — a PMD is listed", s:"We'll look them up next", go:()=>{S.pmd=true;S.step="hiv";render();}},
      {cls:"flat", ic:"○", t:"No PMD listed", s:"→ Medical Service (Our Service)", go:()=>{S.pmd=false;render();}}
    ]});

  if(S.step==="hiv") return ask({
    q:"Is the listed PMD our HIV clinic?",
    hint:"HIV-clinic patients come to us regardless of day.",
    back:()=>{S.pmd=null;S.step="pmd";render();},
    opts:[
      {cls:"alt", ic:"＋", t:"Yes — our HIV clinic", s:"→ Our Service, any day", go:()=>{S.hiv=true;render();}},
      {cls:"", ic:"→", t:"No — a regular PMD", s:"Look up who admits for them", go:()=>{S.hiv=false;S.step="look";render();}}
    ]});

  if(S.step==="look") return lookup();
}

/* ---- generic question card ---- */
function ask({q,hint,opts,back}){
  stage.innerHTML = `<div class="card">
    <p class="q">${q}</p><p class="qhint">${hint}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt ${o.cls}" data-i="${i}">
      <span class="ic">${o.ic}</span><span class="grow"><b>${o.t}</b><span>${o.s}</span></span></button>`).join("")}</div>
    ${back?'<button class="back" id="bk">‹ Back</button>':''}
  </div>`;
  [...stage.querySelectorAll('.opt')].forEach(b=>b.onclick=()=>opts[+b.dataset.i].go());
  if(back) stage.querySelector('#bk').onclick=back;
}

/* ---- PMD search ---- */
function lookup(){
  stage.innerHTML = `<div class="card">
    <p class="q">Look up the PMD</p>
    <p class="qhint">Type the PMD's name as it appears in EmReference. The directory shows who admits their patients.</p>
    <div class="srch">
      <input id="q" type="text" autocomplete="off" placeholder="Start typing a name… e.g. Bikkina, Doss, Old Hook">
      <div class="results" id="rl"></div>
    </div>
    <button class="back" id="bk">‹ Back</button>
  </div>`;
  const q=stage.querySelector('#q'), rl=stage.querySelector('#rl');
  stage.querySelector('#bk').onclick=()=>{S.hiv=null;S.step="hiv";render();};
  let kbd=-1, cur=[];
  function run(){
    const v=q.value.trim().toLowerCase();
    if(v.length<1){ rl.className="results"; rl.innerHTML=""; return; }
    cur=REC.filter(e=>e.name.toLowerCase().includes(v)||(e.group||"").toLowerCase().includes(v)||(e.spec||"").toLowerCase().includes(v)).slice(0,8);
    rl.className="results show"; kbd=-1;
    if(!cur.length){ rl.innerHTML=`<div class="nohit"><b>Not in this directory.</b><br>Default per protocol: admit to the <b>Medical Service (Our Service)</b>. Verify on EmReference.com or the group chat.</div>`; return; }
    rl.innerHTML=cur.map((e,i)=>{const d=classify(e);
      return `<div class="ritem" data-i="${i}"><div><div class="rname">${esc(e.name)}</div>
        <div class="rmeta">${esc([e.spec,e.group].filter(Boolean).join(" · ")||"—")}</div></div>
        <span class="rtag t-${d.type}">${d.label}</span></div>`;}).join("");
    [...rl.querySelectorAll('.ritem')].forEach(it=>it.onclick=()=>choose(cur[+it.dataset.i]));
  }
  q.addEventListener('input',run);
  q.addEventListener('keydown',ev=>{
    const items=[...rl.querySelectorAll('.ritem')]; if(!items.length) return;
    if(ev.key==="ArrowDown"){ev.preventDefault();kbd=Math.min(kbd+1,items.length-1);}
    else if(ev.key==="ArrowUp"){ev.preventDefault();kbd=Math.max(kbd-1,0);}
    else if(ev.key==="Enter"){ev.preventDefault(); if(kbd>=0) choose(cur[kbd]); return;}
    else return;
    items.forEach((it,i)=>it.classList.toggle('kbd',i===kbd));
  });
  q.focus();
}
function choose(e){ S.pick={...e, disp:classify(e)}; S.accepted=null; S.hospAccepted=null; render(); }

/* ---- Hospitalist cascade step (HVA / private / call-first attending did not pick up) ---- */
function hospCascade(e,d){
  stage.innerHTML = `<div class="res med">
     <div class="banner"><div class="bic">＃</div>
       <div><div class="blab">No answer — call next</div><div class="bbig">Hospitalist</div></div></div>
     <div class="body">
       <p class="action"><b>${esc(d.who)}</b> <b>did not pick up</b>. Per protocol, call the <b>Hospitalist</b> next at <b>x4929</b>.</p>
       <div class="ext"><span class="pic">＃</span><span>Hospitalist — <b>x4929</b> (internal extension)</span></div>
       <div class="confirm"><p>Did the Hospitalist accept the admission?</p>
         <div class="crow">
           <button class="cbtn yes" id="hacc">Accepted — Hospitalist admits</button>
           <button class="cbtn no" id="href">Refused → Medical Service</button>
         </div></div>
       ${extraDetail(e)}
       <button class="again" id="again">New patient</button>
       <button class="back" id="bk">‹ Pick a different PMD</button>
     </div></div>`;
  stage.querySelector('#again').onclick=reset;
  stage.querySelector('#bk').onclick=()=>{S.pick=null;S.accepted=null;S.hospAccepted=null;S.step="look";render();};
  stage.querySelector('#hacc').onclick=()=>{S.hospAccepted=true;render();};
  stage.querySelector('#href').onclick=()=>{S.hospAccepted=false;render();};
}

/* ---- result for a chosen PMD ---- */
function pickResult(){
  const e=S.pick, d=e.disp;
  // Cascade:
  //   HVA / private / call-first attending does NOT PICK UP → Hospitalist (x4929)
  //   HVA / private / call-first attending picks up and REFUSES → Medical Service (Our Service) directly
  //   Hospitalist refuses (first-line or after no-answer) → Medical Service (Our Service)
  if(d.refusable && S.accepted===false){
    if(d.type==="hosp"){
      return outcome("us","Hospitalist declined — admit to Medical Service","The <b>Hospitalist</b> <b>declined</b> the admission → admit to the <b>Medical Service (Our Service)</b>.", extraDetail(e));
    }
    return outcome("us","Attending refused — admit to Medical Service",`<b>${esc(d.who)}</b> picked up and <b>refused</b> the admission → admit to the <b>Medical Service (Our Service)</b>.`, extraDetail(e));
  }
  if(d.refusable && S.accepted==="na"){
    if(S.hospAccepted===true){
      return outcome("hosp","Hospitalist accepted","The <b>Hospitalist</b> <b>accepted</b> the admission → admit under the <b>Hospitalist</b> (x4929).", extraDetail(e));
    }
    if(S.hospAccepted===false){
      return outcome("us","Hospitalist declined — admit to Medical Service",`<b>${esc(d.who)}</b> did not pick up and the <b>Hospitalist</b> <b>declined</b> → admit to the <b>Medical Service (Our Service)</b>.`, extraDetail(e));
    }
    return hospCascade(e,d);
  }
  // EmReference lists "Medical Service" — that is Our Service
  if(d.type==="us"){
    return outcome("us","Medical Service = Our Service",d.action, extraDetail(e));
  }
  const tel=telHref(d.num);
  let contact="";
  if(d.num && !tel){
    // internal extension (e.g. x4929) — show as a non-dialable extension chip
    contact=`<div class="ext"><span class="pic">＃</span><span>${esc(d.who)} — <b>${esc(d.num)}</b> (internal extension)</span></div>`;
  } else if(tel){
    contact = `<a class="callbtn" href="${tel}"><span class="pic">☎</span><span class="grow"><div class="who">Call ${esc(d.who)}</div><div class="num">${esc(d.num)}</div></span></a>`;
  } else {
    contact = `<div class="callbtn"><span class="pic">☎</span><span class="grow"><div class="who">${esc(d.who)}</div><div class="num">No number on file — check EmReference / group chat</div></span></div>`;
  }
  let confirm="";
  if(d.refusable && S.accepted==null){
    const q = d.type==="hosp"
      ? "Did the Hospitalist accept the admission?"
      : `Did ${esc(d.who)} accept the admission?`;
    const naBtn = d.type==="hosp" ? "" : `
        <button class="cbtn no" id="na">Did not pick up → call Hospitalist</button>`;
    confirm=`<div class="confirm"><p>${q}</p>
      <div class="crow">
        <button class="cbtn yes" id="acc">Accepted — they admit</button>
        ${naBtn}
        <button class="cbtn no" id="ref">Refused → Medical Service</button>
      </div></div>`;
  }
  const colorOf={hosp:"med",med:"med",us:"us",peds:"peds",call:"call"};
  const color=colorOf[d.type]||"call";
  let kick = d.kick || (d.type==="call" ? "Call to admit" : "Admit under");
  if(d.refusable && S.accepted===true) kick = "Confirmed — "+kick.toLowerCase();
  const icon = d.icon || (d.type==="peds"?"⊕":d.type==="call"?"☎":"＃");

  stage.innerHTML = `<div class="res ${color}">
     <div class="banner"><div class="bic">${icon}</div>
       <div><div class="blab">${kick}</div><div class="bbig">${esc(d.label||d.who)}</div></div></div>
     <div class="body">
       <p class="action">${d.action}</p>
       ${contact}
       ${confirm}
       ${extraDetail(e)}
       <button class="again" id="again">New patient</button>
       <button class="back" id="bk">‹ Pick a different PMD</button>
     </div></div>`;
  stage.querySelector('#again').onclick=reset;
  stage.querySelector('#bk').onclick=()=>{S.pick=null;S.accepted=null;S.hospAccepted=null;S.step="look";render();};
  if(d.refusable && S.accepted==null){
    stage.querySelector('#acc').onclick=()=>{S.accepted=true;render();};
    stage.querySelector('#ref').onclick=()=>{S.accepted=false;render();};
    const na=stage.querySelector('#na'); if(na) na.onclick=()=>{S.accepted="na";render();};
  }
}
function extraDetail(e){
  return `<dl class="detail">
    <dt>PMD</dt><dd>${esc(e.name)}</dd>
    ${e.spec?`<dt>Specialty</dt><dd>${esc(e.spec)}</dd>`:""}
    ${e.group?`<dt>Group</dt><dd>${esc(e.group)}</dd>`:""}
    <dt>EmRef admits</dt><dd>${esc(e.admit||"—")}${e.anum?` · ${esc(e.anum)}`:""}</dd>
    ${e.upd?`<dt>Updated</dt><dd class="${stale(e.upd)?'stale':''}">${esc(e.upd)}${stale(e.upd)?" · verify, &gt;2 yrs old":""}</dd>`:""}
  </dl>`;
}

/* ---- simple outcome (US / fallback) ---- */
function outcome(type,label,text,extra){
  const map={us:["☑","Admit to","Our Service"],med:["＋","Assign to","Medical Service"],hosp:["＃","Admit under","Hospitalist"]};
  const b=map[type]||map.us;
  const color = type==="hosp" ? "med" : type;
  stage.innerHTML=`<div class="res ${color}">
    <div class="banner"><div class="bic">${b[0]}</div>
      <div><div class="blab">${b[1]}</div><div class="bbig">${b[2]}</div></div></div>
    <div class="body"><p class="action"><b>${label}.</b> ${text}</p>
      ${extra||""}
      <button class="again" id="again">New patient</button></div></div>`;
  stage.querySelector('#again').onclick=reset;
}

/* ---- protocol reference ---- */
document.getElementById('ptable').innerHTML=[
  ["No insurance / self-pay","us","Our Service"],
  ["Insurance + no PMD listed","us","Medical Service"],

  ["Insurance + PMD admits here (private or HVA)","call","Call that PMD"],
  ["PMD admits under Pinzon, Amabelle (own group in Passaic — not HVA)","call","Call (862) 249-4901"],

  ["Pinzon not working + nobody in her service covering","call","HVA Admitting Team (201) 490-1217"],

  ["Pinzon / her cover / HVA picks up and refuses","us","Medical Service"],

].map(r=>`<div class="prow"><div class="pcond">${r[0]}</div><span class="pout t-${r[1]}">${r[2]}</span></div>`).join("");

render();
</script>
